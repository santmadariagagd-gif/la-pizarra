name: Actualizar La Pizarra

on:
  schedule:
    - cron: "0 13 * * 5"   # viernes 7:00 am CDMX (después del Thursday Night)
    - cron: "0 13 * * 1"   # lunes 7:00 am CDMX (después del domingo)
    - cron: "0 13 * * 2"   # martes 7:00 am CDMX (después del Monday Night)
  workflow_dispatch:        # botón para correrlo a mano
  push:
    paths: ["notas.json", "template.html", "build_site.py"]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_site.py
      - name: Guardar la página nueva
        run: |
          git config user.name "La Pizarra bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Actualización automática de datos"
          git push
