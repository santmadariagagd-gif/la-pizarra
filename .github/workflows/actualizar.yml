name: Actualizar La Pizarra
on:
  schedule:
    - cron: "0 13 * * *"   # todos los días 7:00 am CDMX
  workflow_dispatch:        # botón "Run workflow"
  push:
    paths: ["notas.json", "ranking.json", "template.html", "build_site.py"]
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt firebase-admin   # firebase-admin: sube los partidos de los grupos
      - run: python build_site.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # clave de The Odds API (Settings → Secrets and variables → Actions)
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}     # llave de servicio de Firebase (JSON) para los grupos de quiniela
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}   # Sportmonks: estadísticas de jugadores de Liga MX
      - name: Guardar la página nueva
        run: |
          git config user.name "La Pizarra bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          if [ -f momios.json ]; then git add momios.json; fi
          git diff --cached --quiet || git commit -m "Actualización automática de datos"
          git pull --rebase   # por si mientras corría subiste archivos o salió el periódico
          git push
