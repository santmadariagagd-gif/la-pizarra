name: Periódico de las ligas
on:
  schedule:
    - cron: "30 14 * * 2"  # martes 8:30 am CDMX (después del Monday Night y de la actualización de las 7 am, que guarda las proyecciones de la previa)
  workflow_dispatch:        # botón "Run workflow"
    inputs:
      semana:
        description: "Semana a publicar (vacío = la última que ya terminó)"
        required: false
      sin_ia:
        description: "Escribe 1 para probar sin gastar en la IA"
        required: false
      ejemplo:
        description: "Escribe 1 para hacer el periódico de EJEMPLO (nombres inventados, carrilla normal)"
        required: false
      solo_armar:
        description: "Escribe 1 para volver a armar la página con los textos que ya escribió la IA (no gasta)"
        required: false
permissions:
  contents: write
jobs:
  periodico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nflreadpy firebase-admin pandas pyarrow pillow   # pyarrow: lo pide polars; pillow: la portada para WhatsApp
      - run: python periodico.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # llave de la API de Claude
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}               # para leer las proyecciones guardadas
          SEMANA: ${{ github.event.inputs.semana }}
          SIN_IA: ${{ github.event.inputs.sin_ia }}
          SOLO_ARMAR: ${{ github.event.inputs.solo_armar }}
          EJEMPLO: ${{ github.event.inputs.ejemplo }}
      - name: Publicar los periódicos
        run: |
          git config user.name "La Pizarra bot"
          git config user.email "actions@github.com"
          git add docs/periodico || true
          git diff --cached --quiet && exit 0
          git commit -m "Periódico de las ligas"
          git pull --rebase
          git push
