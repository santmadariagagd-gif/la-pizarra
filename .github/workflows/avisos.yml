name: Avisos al teléfono
# Cada 10 minutos revisa partidos de los equipos favoritos, solicitudes de amistad, retos y comentarios,
# y manda las notificaciones a quienes las activaron (ver avisos.py). Si hay partido en juego, se queda ~9 min revisando.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      prueba_correo:
        description: "Escribe 1 para mandarle al dueño un correo de prueba"
        required: false
permissions:
  contents: read
  actions: write   # para disparar el periódico si GitHub se saltó su corrida del martes
concurrency:
  group: avisos
  cancel-in-progress: false
jobs:
  avisos:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install firebase-admin
      - run: python avisos.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}   # correos de recordatorio (correos.py)
          CORREO_PRUEBA: ${{ github.event.inputs.prueba_correo }}
